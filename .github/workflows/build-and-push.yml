name: Build and push Replay.jar

on:
  push:
    branches:
      - master
    paths-ignore:
      - "build/**"

permissions:
  contents: write

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Replay.jar
        run: ./gradlew clean build --no-daemon

      - name: Commit and push Replay.jar
        shell: bash
        run: |
          set -euo pipefail

          test -f build/libs/Replay.jar
          git add -f build/libs/Replay.jar

          if git diff --cached --quiet -- build/libs/Replay.jar; then
            echo "Replay.jar is unchanged; nothing to push."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Replay.jar [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
